<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <title>News feed icon sprite</title>
  <!--
    Placeholder icons for the News feed (see src/types/news.ts's
    NewsEntryType). Each <symbol> uses a 512x512 viewBox so it's a drop-in
    replacement target for real custom artwork later — these are
    intentionally simple geometric placeholders, not final art.
  -->
  <symbol id="new-game" viewBox="0 0 512 512">
    <title>Novo jogo (placeholder)</title>
    <circle cx="256" cy="256" r="200" fill="none" stroke="currentColor" stroke-width="32" />
    <path d="M256 136v240M136 256h240" stroke="currentColor" stroke-width="32" stroke-linecap="round" />
  </symbol>
  <symbol id="new-contribution" viewBox="0 0 512 512">
    <title>Nova contribuição (placeholder)</title>
    <path
      d="M256 432 96 272c-48-48-48-128 0-176 48-48 128-48 176 0l-16 16-16-16c-48-48-128-48-176 0-48 48-48 128 0 176l160 160 160-160c48-48 48-128 0-176-48-48-128-48-176 0l-16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </symbol>
  <symbol id="rules-change" viewBox="0 0 512 512">
    <title>Mudança nas regras (placeholder)</title>
