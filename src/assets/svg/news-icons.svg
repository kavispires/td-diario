      stroke="currentColor"
      stroke-width="28"
      stroke-linejoin="round"
    />
    <path d="M368 192v128" stroke="currentColor" stroke-width="28" stroke-linecap="round" />
    <path d="M144 288v64a32 32 0 0 0 32 32h16a32 32 0 0 0 32-32v-48" fill="none" stroke="currentColor" stroke-width="28" />
