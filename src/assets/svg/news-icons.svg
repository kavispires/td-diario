    <circle cx="256" cy="256" r="88" fill="none" stroke="currentColor" stroke-width="28" />
  </symbol>
  <symbol id="weekend" viewBox="0 0 512 512">
    <title>Edição de fim de semana (placeholder)</title>
    <rect x="96" y="128" width="320" height="288" rx="24" fill="none" stroke="currentColor" stroke-width="28" />
    <path d="M96 208h320M176 80v96M336 80v96" stroke="currentColor" stroke-width="28" stroke-linecap="round" />
    <circle cx="208" cy="304" r="20" fill="currentColor" />
    <circle cx="304" cy="304" r="20" fill="currentColor" />
