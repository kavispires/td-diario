<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>TD Diário</title>
    <style>
      @keyframes movingGradient {
        0% {
          background-position: 0% 50%;
        }

        50% {
          background-position: 100% 50%;
        }

        100% {
          background-position: 0% 50%;
        }
      }

      body {
        margin: 0;
      }

      .native-splash {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background: linear-gradient(
          -45deg,
        #fac0a3,
        #eac3bd,
        #c8c1d0,
        #b9ded8,
        #fcd4b5,
        #f9d8c8,
        #e6d4dc,
        #fac0a3
        );
        background-size: 400% 400%;
        animation: movingGradient 3s ease infinite;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: 0.85rem;
        gap: 1rem;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.25;
        }
      }

      .loading-text {
        text-transform: capitalize;
        font-weight: bold;
        animation: blink 1s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="native-splash">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="dev-icon"
          viewBox="0 0 512 512"
          role="img"
          aria-label="Animated logo"
        >
          <style>
            .dev-icon {
              width: 128px;
              overflow: visible;
              cursor: pointer;
            }

            /* ---------------------------------
              Entire logo
            ---------------------------------- */
            .logo {
              transform-origin: 256px 256px;
              animation: logo-breathe 5s 1.6s ease-in-out infinite;
            }

            /* ---------------------------------
              Individual pieces
            ---------------------------------- */
            .piece {
              transform-box: view-box;
              transform-origin: 256px 256px;
            }

            .red {
              animation: enter-red 900ms cubic-bezier(.2,1.5,.4,1) both;
            }

            .yellow {
              animation: enter-yellow 900ms 120ms cubic-bezier(.2,1.5,.4,1) both;
            }

            .green {
              animation: enter-green 900ms 240ms cubic-bezier(.2,1.5,.4,1) both;
            }

            .blue {
              animation: enter-blue 900ms 360ms cubic-bezier(.2,1.5,.4,1) both;
            }

            /* Black structural outline appears last */
            .outline {
              transform-box: view-box;
              transform-origin: 256px 256px;
              animation: outline-in 500ms 820ms ease-out both;
            }

            /* ---------------------------------
              Assembly animations
            ---------------------------------- */
            @keyframes enter-red {
              0% {
                opacity: 0;
                transform: translate(-150px, 0) rotate(-18deg) scale(.65);
              }
              70% {
                opacity: 1;
                transform: translate(10px, 0) rotate(2deg) scale(1.03);
              }
              100% {
                opacity: 1;
                transform: none;
              }
            }

            @keyframes enter-yellow {
              0% {
                opacity: 0;
                transform: translate(0, -150px) rotate(18deg) scale(.65);
              }
              70% {
                opacity: 1;
                transform: translate(0, 10px) rotate(-2deg) scale(1.03);
              }
              100% {
                opacity: 1;
                transform: none;
              }
            }

            @keyframes enter-green {
              0% {
                opacity: 0;
                transform: translate(150px, 0) rotate(18deg) scale(.65);
              }
              70% {
                opacity: 1;
                transform: translate(-10px, 0) rotate(-2deg) scale(1.03);
              }
              100% {
                opacity: 1;
                transform: none;
              }
            }

            @keyframes enter-blue {
              0% {
                opacity: 0;
                transform: translate(0, 150px) rotate(-18deg) scale(.65);
              }
              70% {
                opacity: 1;
                transform: translate(0, -10px) rotate(2deg) scale(1.03);
              }
              100% {
                opacity: 1;
                transform: none;
              }
            }

            @keyframes outline-in {
              0% {
                opacity: 0;
                transform: scale(.9);
              }

              55% {
                opacity: 1;
                transform: scale(1.035);
              }

              100% {
                opacity: 1;
                transform: scale(1);
              }
            }

            /* ---------------------------------
              Finished-logo pulse
            ---------------------------------- */
            @keyframes logo-breathe {
              0%, 82%, 100% {
                transform: scale(1);
              }

              88% {
                transform: scale(1.025) rotate(.8deg);
              }

              94% {
                transform: scale(.995) rotate(-.4deg);
              }
            }

            /* ---------------------------------
              Hover interaction
            ---------------------------------- */
            .dev-icon:hover .logo {
              animation-play-state: paused;
              transform: scale(1.055) rotate(2deg);
              transition:
                transform 350ms cubic-bezier(.2,1.5,.4,1),
                filter 350ms ease;
              filter:
                drop-shadow(0 8px 12px rgba(0,0,0,.16))
                drop-shadow(0 0 18px rgba(68,187,164,.3));
            }

            .dev-icon:hover .red {
              transform: translate(-3px, 3px);
            }

            .dev-icon:hover .yellow {
              transform: translate(-3px, -3px);
            }

            .dev-icon:hover .green {
              transform: translate(3px, -3px);
            }

            .dev-icon:hover .blue {
              transform: translate(3px, 3px);
            }

            .dev-icon:hover .piece {
              transition: transform 350ms cubic-bezier(.2,1.5,.4,1);
            }

            /* Accessibility */
            @media (prefers-reduced-motion: reduce) {
              .logo,
              .piece,
              .outline {
                animation: none;
              }
            }
          </style>

          <g class="logo">
            <!-- BLUE / BOTTOM -->
            <g class="piece blue">
              <path
                fill="#3a7ca5"
                d="m256 267-11.73 11.73-94.72 94.72a16.61 16.61 0 0 0 0 23.45l94.72 94.72a16.6 16.6 0 0 0 23.46 0L377.44 381.9a31.84 31.84 0 0 1-15-8.46z"
              />
              <path
                fill="#22698c"
                d="M362.45 373.44 267 278l-11-11-11 11-.74.73-94.72 94.72a16.61 16.61 0 0 0 0 23.45l11 11a16.59 16.59 0 0 1 0-23.45l94.72-94.72.74-.73 95.45 95.45a31.9 31.9 0 0 0 15 8.46l7.75-7.75 3.24-3.24a31.84 31.84 0 0 1-14.99-8.48"
              />
            </g>

            <!-- GREEN / RIGHT -->
            <g class="piece green">
              <path
                fill="#44bba4"
                d="m373.44 149.55-89.22 89.23-5.5 5.49-5.5 5.5L267 256l106.44 106.45a16.61 16.61 0 0 0 23.45 0l5.5-5.49 89.22-89.22a16.6 16.6 0 0 0 0-23.46L381.9 134.56a31.84 31.84 0 0 1-8.46 14.99"
              />
              <path
                fill="#32a58f"
                d="m373.44 149.55-89.22 89.23-5.5 5.49-5.5 5.5L267 256l11 11 6.23-6.23 5.49-5.49 5.5-5.5 89.22-89.22a31.9 31.9 0 0 0 8.46-15l-11-11a31.84 31.84 0 0 1-8.46 14.99"
              />
            </g>

            <!-- YELLOW / TOP -->
            <g class="piece yellow">
              <path
                fill="#f2e863"
                d="M244.27 20.39 134.56 130.1a31.84 31.84 0 0 1 15 8.46l89.23 89.22 5.49 5.5 5.5 5.5L256 245l11.73-11.73 94.72-94.72a16.61 16.61 0 0 0 0-23.45l-5.5-5.5-89.22-89.21a16.6 16.6 0 0 0-23.46 0"
              />
              <path
                fill="#cebf38"
                d="m244.27 20.39-98.72 98.72-11 11c.66.17 1.32.35 2 .56.33.1.66.23 1 .35l.92.32c.45.18.9.37 1.34.57l.53.22c.51.24 1 .5 1.52.77l.28.14c.55.3 1.09.62 1.63.95l.12.07c.56.36 1.12.73 1.67 1.12a34 34 0 0 1 3.24 2.66c.25.24.51.46.75.71l89.23 89.22 5.49 5.5 5.5 5.5L256 245l11-11-6.23-6.23-5.49-5.49-5.5-5.5-89.22-89.22c-.25-.25-.51-.47-.76-.71l95.48-95.48a16.61 16.61 0 0 1 23.45 0l-11-11a16.6 16.6 0 0 0-23.46.02"
              />
            </g>

            <!-- RED / LEFT -->
            <g class="piece red">
              <path
                fill="#f45b69"
                d="M122 145.43a16.5 16.5 0 0 0-6.87 4.12l-5.5 5.5-89.24 89.22a16.6 16.6 0 0 0 0 23.46l94.72 94.72a16.61 16.61 0 0 0 23.45 0l89.22-89.23 5.5-5.49 5.5-5.5L245 256l-11.73-11.73-94.72-94.72a16.59 16.59 0 0 0-16.55-4.12"
              />
            </g>

            <!-- BLACK OUTLINE / FRAME -->
            <path
              class="outline"
              d="M233.28 9.39 104.12 138.56 9.4 233.28a32.17 32.17 0 0 0 0 45.44l94.73 94.72a32 32 0 0 0 25.15 9.29 32 32 0 0 0 9.29 25.15l94.72 94.72a32.16 32.16 0 0 0 45.44 0l129.15-129.16 94.72-94.72a32.18 32.18 0 0 0 0-45.44L373.44 104.12 278.72 9.39a32.18 32.18 0 0 0-45.44 0m258.33 234.88a16.6 16.6 0 0 1 0 23.46L402.39 357l-5.5 5.49a16.61 16.61 0 0 1-23.45 0L267 256l6.23-6.23 5.5-5.5 5.5-5.49 89.22-89.23a31.84 31.84 0 0 0 8.46-15zM267.73 491.61a16.6 16.6 0 0 1-23.46 0l-94.72-94.72a16.61 16.61 0 0 1 0-23.45l94.72-94.72L256 267l106.45 106.44a31.84 31.84 0 0 0 15 8.46zM115.11 362.45l-94.72-94.72a16.6 16.6 0 0 1 0-23.46l89.22-89.22 5.5-5.5a16.61 16.61 0 0 1 23.45 0l94.72 94.72L245 256l-6.23 6.23-5.5 5.5-5.5 5.49-89.22 89.23a16.61 16.61 0 0 1-23.44 0M267.73 20.39 357 109.61l5.5 5.5a16.61 16.61 0 0 1 0 23.45l-94.72 94.72L256 245l-6.23-6.23-5.5-5.5-5.49-5.5-89.23-89.22a31.84 31.84 0 0 0-15-8.46l109.72-109.7a16.6 16.6 0 0 1 23.46 0"
            />
          </g>
        </svg>
        <span class="loading-text">TD Diário</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
